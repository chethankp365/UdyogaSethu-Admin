<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Ecosystem user split" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="300" rx="16" fill="#0b1220" stroke="#1e293b"/>
  <text x="400" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">Ecosystem User Split (demo seed data)</text>
  <g transform="translate(200,170) rotate(-90)" fill="none" stroke-width="44">
    <circle r="80" stroke="#22c55e" stroke-dasharray="284.84 502.65" stroke-dashoffset="0"/>
    <circle r="80" stroke="#f59e0b" stroke-dasharray="117.28 502.65" stroke-dashoffset="-284.84"/>
    <circle r="80" stroke="#0ea5e9" stroke-dasharray="83.78 502.65" stroke-dashoffset="-402.12"/>
    <circle r="80" stroke="#a78bfa" stroke-dasharray="16.76 502.65" stroke-dashoffset="-485.90"/>
  </g>
  <text x="200" y="168" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">30</text>
  <text x="200" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">total users</text>
