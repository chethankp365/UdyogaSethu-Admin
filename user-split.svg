    <rect x="400" y="140" width="18" height="18" rx="4" fill="#f59e0b"/><text x="430" y="155">Service Providers</text><text x="700" y="155" text-anchor="end" fill="#94a3b8">7 (23.3%)</text>
    <rect x="400" y="180" width="18" height="18" rx="4" fill="#0ea5e9"/><text x="430" y="195">Farmers</text><text x="700" y="195" text-anchor="end" fill="#94a3b8">5 (16.7%)</text>
    <rect x="400" y="220" width="18" height="18" rx="4" fill="#a78bfa"/><text x="430" y="235">System Admin</text><text x="700" y="235" text-anchor="end" fill="#94a3b8">1 (3.3%)</text>
