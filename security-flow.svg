<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" role="img" aria-label="Security by design flow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
  </defs>
  <rect width="900" height="770" rx="16" fill="#0b1220" stroke="#1e293b"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">
    <g stroke="#cbd5e1" stroke-width="1.8" fill="none" marker-end="url(#a)">
      <line x1="450" y1="60" x2="450" y2="88"/>
      <line x1="450" y1="134" x2="450" y2="162"/>
      <line x1="450" y1="208" x2="450" y2="228"/>
      <path d="M360,270 L170,270 L170,358"/>
      <line x1="450" y1="310" x2="450" y2="358"/>
      <path d="M540,270 L730,270 L730,358" stroke="#f87171"/>
      <path d="M170,420 L170,492 L268,492"/>
      <line x1="450" y1="420" x2="450" y2="470"/>
      <line x1="450" y1="514" x2="450" y2="544"/>
      <line x1="450" y1="588" x2="450" y2="618"/>
      <line x1="450" y1="662" x2="450" y2="692"/>
    </g>
    <!-- neutral steps -->
    <rect x="350" y="20" width="200" height="40" rx="20" fill="#111c2e" stroke="#38bdf8" stroke-width="1.5"/><text x="450" y="46">Administrator</text>
    <rect x="240" y="90" width="420" height="44" rx="10" fill="#111c2e" stroke="#38bdf8" stroke-width="1.5"/><text x="450" y="118">Login · Spring Security + BCrypt</text>
    <rect x="210" y="164" width="480" height="44" rx="10" fill="#111c2e" stroke="#38bdf8" stroke-width="1.5"/><text x="450" y="192">Secure session cookie + HTTP security headers</text>
    <polygon points="450,230 540,270 450,310 360,270" fill="#33240c" stroke="#f59e0b" stroke-width="1.5"/><text x="450" y="276" font-weight="700">Role?</text>
    <!-- edge labels -->
    <g font-size="13" fill="#94a3b8">
      <text x="265" y="262">SUPER_ADMIN</text>
      <text x="492" y="340" text-anchor="start">ADMIN</text>
      <text x="635" y="262" fill="#f87171">USER</text>
    </g>
    <!-- role outcomes -->
    <rect x="50" y="360" width="240" height="60" rx="10" fill="#0f2a1d" stroke="#22c55e" stroke-width="1.5"/><text x="170" y="386">Admin management</text><text x="170" y="406" fill="#94a3b8" font-size="13">restricted settings</text>
    <rect x="330" y="360" width="240" height="60" rx="10" fill="#0f2a1d" stroke="#22c55e" stroke-width="1.5"/><text x="450" y="386">Operational management</text><text x="450" y="406" fill="#94a3b8" font-size="13">permitted actions</text>
    <rect x="620" y="360" width="220" height="60" rx="10" fill="#3a1212" stroke="#ef4444" stroke-width="1.5"/><text x="730" y="396" fill="#fca5a5" font-weight="600">No administrative access</text>
    <!-- enforcement chain -->
    <rect x="270" y="470" width="360" height="44" rx="10" fill="#0f2a1d" stroke="#22c55e" stroke-width="1.5"/><text x="450" y="498">@PreAuthorize (method-level)</text>
    <rect x="210" y="544" width="480" height="44" rx="10" fill="#0f2a1d" stroke="#22c55e" stroke-width="1.5"/><text x="450" y="572">Restricted DB role · column-level privileges</text>
    <rect x="240" y="618" width="420" height="44" rx="10" fill="#0f2a1d" stroke="#22c55e" stroke-width="1.5"/><text x="450" y="646">Supabase Row Level Security</text>
    <rect x="330" y="692" width="240" height="44" rx="22" fill="#0f2a1d" stroke="#22c55e" stroke-width="1.5"/><text x="450" y="720">Audit log</text>
  </g>
</svg>
