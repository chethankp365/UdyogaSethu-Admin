server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: false # overridden to true in application-prod.yml

spring:
  application:
    name: udyogasethu-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    banner-mode: console

vaadin:
  launch-browser: false
  whitelisted-packages:
    - com.udyogasethu.admin

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
