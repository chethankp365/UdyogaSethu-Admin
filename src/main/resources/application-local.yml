spring:
  datasource:
    url: jdbc:h2:mem:udyogasethu_admin;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS admin\;
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public
  flyway:
    enabled: false # H2 creates tables via JPA in local dev mode
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

admin:
  bootstrap:
    enabled: true
    superadmin-email: ${SUPERADMIN_EMAIL:admin@udyogasethu.org}
    superadmin-name: ${SUPERADMIN_NAME:Platform Administrator}
    superadmin-password: ${SUPERADMIN_PASSWORD:Admin@Setu2026!}
  seed:
    demo-data: false
