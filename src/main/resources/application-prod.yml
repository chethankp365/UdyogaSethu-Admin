server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST:aws-0-ap-southeast-1.pooler.supabase.com}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require&prepareThreshold=0
    username: ${SUPABASE_DB_USERNAME:udyogasethu_admin_app.mmzbpeqkfomnywuzoqii}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
      pool-name: UdyogaSethuAdminHikariPool
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # NEVER mutate existing tables via Hibernate
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    schemas: admin
    default-schema: admin
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

admin:
  bootstrap:
    enabled: true
    superadmin-email: ${SUPERADMIN_EMAIL:admin@udyogasethu.org}
    superadmin-name: ${SUPERADMIN_NAME:Platform Administrator}
    superadmin-password: ${SUPERADMIN_PASSWORD:}
  seed:
    demo-data: false
