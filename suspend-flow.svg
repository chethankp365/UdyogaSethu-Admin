<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="950" height="520" role="img" aria-label="Suspending an account end-to-end" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
  </defs>
  <rect width="950" height="520" rx="16" fill="#0b1220" stroke="#1e293b"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#e2e8f0">
    <!-- lifelines -->
    <g stroke="#334155" stroke-dasharray="5 5" stroke-width="1.5">
      <line x1="150" y1="68" x2="150" y2="495"/><line x1="470" y1="68" x2="470" y2="495"/><line x1="790" y1="68" x2="790" y2="495"/>
    </g>
    <!-- participants -->
    <rect x="50" y="20" width="200" height="48" rx="10" fill="#0c2a3d" stroke="#0ea5e9" stroke-width="1.5"/><text x="150" y="50" text-anchor="middle" font-weight="600">Worker (Flutter)</text>
    <rect x="370" y="20" width="200" height="48" rx="10" fill="#0f2a1d" stroke="#22c55e" stroke-width="1.5"/><text x="470" y="50" text-anchor="middle" font-weight="600">Supabase PostgreSQL</text>
    <rect x="690" y="20" width="200" height="48" rx="10" fill="#33240c" stroke="#f59e0b" stroke-width="1.5"/><text x="790" y="50" text-anchor="middle" font-weight="600">Admin Portal</text>
    <!-- messages -->
    <g stroke="#cbd5e1" stroke-width="1.8" fill="none" marker-end="url(#a)">
      <line x1="150" y1="115" x2="466" y2="115"/>
      <line x1="790" y1="170" x2="474" y2="170"/>
      <path d="M790,225 L840,225 L840,255 L794,255"/>
      <line x1="790" y1="310" x2="474" y2="310"/>
      <line x1="150" y1="365" x2="466" y2="365"/>
      <line x1="470" y1="415" x2="154" y2="415" stroke-dasharray="6 5"/>
      <path d="M150,455 L200,455 L200,482 L154,482"/>
    </g>
    <g text-anchor="middle">
      <text x="308" y="104">1. Registers → profile created</text>
      <text x="632" y="159">2. Retrieves profile (shared database)</text>
      <text x="632" y="299">4. Updates account status + writes audit log</text>
      <text x="308" y="354">5. App checks account status</text>
      <text x="312" y="404" fill="#f87171" font-weight="700">6. SUSPENDED</text>
    </g>
    <text x="830" y="212" text-anchor="end">3. Reviews account, clicks Suspend</text>
    <text x="215" y="472">7. Redirected to the suspended-account screen</text>
  </g>
</svg>
